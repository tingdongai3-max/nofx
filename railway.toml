# Railway 一键部署配置
# 部署前：1) 添加 PostgreSQL 插件并关联；2) 将卷挂载到 /data 以持久化数据库与配置
#
# Variables 必配：
#   DEEPSEEK_API_KEY      - DeepSeek AI API Key（AI 交易必需）
#   JWT_SECRET            - JWT 签名密钥（生产环境必改）
#   DATA_ENCRYPTION_KEY   - 固定 base64 密钥（openssl rand -base64 32），禁止每次启动随机生成

[build]
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
